# TypeScript 7 native LSP (project-local), matching Zed's tsc --lsp setup.
# Space-/ still works without this; gd/gr/gi need a live language server.

[language-server.tsc]
command = "node_modules/.bin/tsc"
args = ["--lsp", "--stdio"]

[language-server.tsc.config.typescript]
format.enabled = false
inlayHints.enumMemberValues.enabled = true
inlayHints.functionLikeReturnTypes.enabled = true
inlayHints.parameterTypes.enabled = true
inlayHints.parameterNames.enabled = "all"
inlayHints.propertyDeclarationTypes.enabled = true
inlayHints.variableTypes.enabled = true

[language-server.tsc.config.javascript]
format.enabled = false
inlayHints.enumMemberValues.enabled = true
inlayHints.functionLikeReturnTypes.enabled = true
inlayHints.parameterTypes.enabled = true
inlayHints.parameterNames.enabled = "all"
inlayHints.propertyDeclarationTypes.enabled = true
inlayHints.variableTypes.enabled = true

[[language]]
name = "typescript"
language-servers = ["tsc", "typescript-language-server"]

[[language]]
name = "tsx"
language-servers = ["tsc", "typescript-language-server"]

[[language]]
name = "javascript"
language-servers = ["tsc", "typescript-language-server"]

[[language]]
name = "jsx"
language-servers = ["tsc", "typescript-language-server"]

[language-server.rust-analyzer]
command = "rust-analyzer"

[language-server.rust-analyzer.config.files]
watcher = "server"

[language-server.rust-analyzer.config.cargo]
buildScripts.enable = true
features = "all"

[language-server.rust-analyzer.config.check]
command = "clippy"

[language-server.rust-analyzer.config.procMacro]
enable = true

[language-server.rust-analyzer.config.diagnostics]
disabled = ["unresolved-proc-macro"]
experimental.enable = true

[language-server.rust-analyzer.config.inlayHints]
bindingModeHints.enable = true
closingBraceHints.enable = true
closingBraceHints.minLines = 10
closureReturnTypeHints.enable = "always"
lifetimeElisionHints.enable = "always"
parameterHints.enable = true
reborrowHints.enable = "always"
typeHints.enable = true
chainingHints.enable = true

[language-server.rust-analyzer.config.hover]
actions.enable = true
actions.implementations.enable = true
actions.references.enable = true
actions.run.enable = true
memoryLayout.niches = true

[language-server.rust-analyzer.config.lens]
enable = true
implementations.enable = true
references.adt.enable = true
references.trait.enable = true
methodReferences.enable = true
run.enable = true

[language-server.rust-analyzer.config.completion]
autoimport.enable = true
autoself.enable = true
callable.snippets = "fill_arguments"
postfix.enable = true
privateEditable.enable = true

[language-server.rust-analyzer.config.assist]
emitMustUse = true
expressionFillDefault = "default"

[language-server.rust-analyzer.config.workspace.symbol]
search.kind = "all_symbols"
search.scope = "workspace"

[[language]]
name = "rust"
language-servers = ["rust-analyzer"]
auto-format = true

# tsgo (TS7 native) first; classic typescript-language-server as fallback.
# Both installed globally so Helix finds them from any workspace root.

[language-server.tsgo]
command = "/Users/carlo/.bun/bin/tsgo"
args = ["--lsp", "--stdio"]
timeout = 60

[language-server.typescript-language-server]
command = "/Users/carlo/.bun/bin/typescript-language-server"
args = ["--stdio"]
timeout = 60

[[language]]
name = "typescript"
language-servers = ["tsgo"]

[[language]]
name = "tsx"
language-servers = ["tsgo"]

[[language]]
name = "javascript"
language-servers = ["tsgo"]

[[language]]
name = "jsx"
language-servers = ["tsgo"]

[language-server.rust-analyzer]
command = "rust-analyzer"
timeout = 120

[[language]]
name = "rust"
language-servers = ["rust-analyzer"]
auto-format = true

# No `[` auto-pair — breaks markdown checkboxes (`- [ ]`)
[[language]]
name = "markdown"

[language.auto-pairs]
"(" = ")"
"{" = "}"
"\"" = "\""
"`" = "`"
"'" = "'"

theme = "blankeos-zen-dark-blurred"

[editor]
line-number = "relative"
bufferline = "always"

[editor.soft-wrap]
enable = false

[editor.file-picker]
hidden = false
git-ignore = true

[editor.cursor-shape]
normal = "block"
insert = "bar"

# Good shortcuts
[keys.normal.z]
w = ":toggle soft-wrap.enable"

[keys.normal]
# Open yazi w/ ctrl-y (https://github.com/helix-editor/helix/discussions/12934)
C-y = [
  ':sh rm -f /tmp/unique-file',
  ':insert-output yazi %{buffer_name} --chooser-file=/tmp/unique-file',
  ':insert-output echo "\x1b[?1049h\x1b[?2004h" > /dev/tty',
  ':open %sh{cat /tmp/unique-file}',
  ':redraw',
]
# Lazygitrs (space G …): g = open, f = file history. Capital G so `space g`
# (changed-file picker) keeps working. No `:new` — that would switch to a
# scratch buffer and `%{file_path_absolute}` would expand to cwd, not the file.
[keys.normal.space.G]
g = [":insert-output lazygitrs", ":redraw"]
f = [":insert-output lazygitrs -f '%{file_path_absolute}'", ":redraw"]

# Preview markdown in crabmd (GPUI app)
[keys.normal.space]
m = ':sh crabmd "%{buffer_name}:%{cursor_line}:%{cursor_column}"'

# Yank path menu (space Y …). Single :sh so which-key shows the raw command.
# (space y stays Helix's default yank-to-clipboard)
[keys.normal.space.Y]
p = ":sh printf '%%s' '%{buffer_name}' | pbcopy"
a = ":sh printf '%%s' '%{file_path_absolute}' | pbcopy"
n = ":sh printf '%%s' \"$(basename '%{buffer_name}')\" | pbcopy"
l = ":sh printf '%%s' '%{buffer_name}:%{cursor_line}' | pbcopy"


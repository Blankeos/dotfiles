theme = "blankeos-zen-dark-blurred"

[editor]
line-number = "relative"
bufferline = "always"

[editor.soft-wrap]
enable = false

[editor.file-picker]
hidden = false
git-ignore = true

[editor.cursor-shape]
normal = "block"
insert = "bar"

# Good shortcuts
[keys.normal.z]
w = ":toggle soft-wrap.enable"

[keys.normal]
# Open yazi w/ ctrl-y (https://github.com/helix-editor/helix/discussions/12934)
C-y = [
  ':sh rm -f /tmp/unique-file',
  ':insert-output yazi %{buffer_name} --chooser-file=/tmp/unique-file',
  ':insert-output echo "\x1b[?1049h\x1b[?2004h" > /dev/tty',
  ':open %sh{cat /tmp/unique-file}',
  ':redraw',
]
# Open lazygitrs w/ ctrl-g
"C-g" = [":new", ":insert-output lazygitrs", ":buffer-close!", ":redraw"]

# Preview markdown in browser (gh extension: yusukebe/gh-markdown-preview)
# Kills any prior preview first so you don't leave orphan servers on :3333
[keys.normal.space]
m = ":sh pkill -f 'gh-markdown-preview|gh markdown-preview' 2>/dev/null; gh markdown-preview %{buffer_name} --dark-mode >/dev/null 2>&1 &"
# Yank path menu (space Y …). Single :sh so which-key shows the raw command.
# (space y stays Helix's default yank-to-clipboard)
[keys.normal.space.Y]
p = ":sh printf '%%s' '%{buffer_name}' | pbcopy"
a = ":sh printf '%%s' '%{file_path_absolute}' | pbcopy"
n = ":sh printf '%%s' \"$(basename '%{buffer_name}')\" | pbcopy"
l = ":sh printf '%%s' '%{buffer_name}:%{cursor_line}' | pbcopy"


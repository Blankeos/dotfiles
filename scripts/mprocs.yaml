# `uptools`: update everything in parallel.
# Everything installed from bootstrap/ (brew + my cargo/go/bun tools) updates via
# `bootstrap.sh --update`. Only tools that update themselves are listed here.
procs:
  dotfiles:
    shell: ./bootstrap.sh --update
  uv:
    shell: command -v uv >/dev/null && uv self update || echo "uv not installed"
  rustup:
    shell: command -v rustup >/dev/null && rustup update || echo "rustup not installed"
  bun:
    shell: command -v bun >/dev/null && bun upgrade || echo "bun not installed"
  claude:
    shell: command -v claude >/dev/null && claude update || echo "claude not installed"
  ohmyzsh:
    shell: zsh -ic 'omz update'
  cua-driver:
    shell: command -v cua-driver >/dev/null && cua-driver update --apply || echo "cua-driver not installed"

procs:
  uv:
    shell: uv self update
  opencode:
    shell: brew upgrade anomalyco/tap/opencode
  rustup:
    shell: rustup upgrade
  bun:
    shell: bun upgrade
  claude:
    shell: claude upgrade
  codex:
    shell: brew upgrade --cask codex
  lazygit:
    shell: brew upgrade lazygit
  ohmyzsh:
    shell: zsh -ic 'omz update'
  herdr:
    shell: brew upgrade herdr
  zoxide:
    shell: brew upgrade zoxide
  eza:
    shell: brew upgrade eza
  gh:
    shell: brew upgrade gh
  yt-dlp:
    shell: brew upgrade yt-dlp
  wezterm:
    shell: brew upgrade --cask wezterm
  ghostty:
    shell: brew upgrade --cask ghostty
  cua-driver:
    shell: cua-driver update --apply
  agent-desktop:
    shell: bun install -g agent-desktop
  agent-browser:
    shell: bun install -g agent-browser
  hex:
    shell: brew ugprade --cask anomalyco/tap/hex
  # My Tools
  lazygitrs:
    shell: cargo binstall --no-confirm lazygitrs
  iconmate:
    shell: cargo binstall --no-confirm iconmate
  crabcode:
    shell: cargo binstall --no-confirm crabcode
  devrefs:
    shell: cargo binstall --no-confirm devrefs
  cftun:
    shell: cargo binstall --no-confirm cftun
  uplate:
    shell: cargo binstall --no-confirm uplate
  crabenv:
    shell: cargo binstall --no-confirm crabenv
  gittydocs:
    shell: npm install -g gittydocs@latest
  crabmd:
    shell: brew upgrade --cask blankeos/tap/crabmd
  herdr-serve:
    shell: go install github.com/Blankeos/herdr-serve/cmd/herdr-serve@latest
